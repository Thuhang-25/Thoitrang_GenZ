<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thời Trang GenZ - JM Dress Design</title>
  <link rel="stylesheet" href="style.css">
  <!-- Thêm FontAwesome cho biểu tượng -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- 1. HEADER DRESS DESIGN -->
  <header class="header-jm">
    <div class="header-container">
      
      <!-- LOGO -->
      <div class="logo-box">
        <h1 class="logo-title">J D D</h1>
        <span class="logo-sub">JM DRESS DESIGN</span>
      </div>

      <!-- NAVIGATION MENU -->
      <nav class="nav-menu">
        <ul>
          <li>
            <a href="index.html" class="sale-link">
              <span class="badge-sale">SALE</span>
              KHỞI NGUỒN TINH KHÔI <i class="fa-solid fa-angle-down"></i>
            </a>
          </li>
          <li><a href="dam.html">ĐẦM</a></li>
          <li><a href="ao.html">ÁO</a></li>
          <li><a href="quan.html">QUẦN</a></li>
          <li><a href="chanvay.html">CHÂN VÁY</a></li>
          <li><a href="aokhoac.html">ÁO KHOÁC</a></li>
          <li><a href="lookbook.html">LOOKBOOK</a></li>
          <li><a href="bst.html">BST MỚI</a></li>
        </ul>
      </nav>

      <!-- ICONS BÊN PHẢI -->
      <div class="header-right">
        <a href="#"><i class="fa-regular fa-heart"></i> <span>0</span></a>
        <a href="#"><i class="fa-solid fa-bag-shopping"></i> <span>0</span></a>
        <a href="#"><i class="fa-regular fa-user"></i></a>
      </div>

    </div>
  </header>

  <!-- 2. SUB-BAR UTILITY -->
  <section class="sub-bar">
    <div class="sub-container">
      <div class="sub-item"><i class="fa-solid fa-map-location-dot"></i> Hệ thống cửa hàng</div>
      <div class="sub-item"><i class="fa-solid fa-truck-fast"></i> Thông tin vận chuyển</div>
      <div class="sub-item"><i class="fa-regular fa-id-card"></i> Chính sách tích điểm</div>
    </div>
  </section>

  <!-- 3. HERO BANNER SECTION -->
  <section class="hero-section">
    <!-- Bạn thay ảnh banner hero của bạn vào đường dẫn src bên dưới -->
    <img src="hinhanh/anh trang chu.jpg" alt="Giấc mơ dịu dàng" class="hero-img">

    <!-- Thanh tìm kiếm đè lên Banner -->
    <div class="search-box-container">
      <input type="text" placeholder="Bạn muốn tìm sản phẩm gì ?">
      <button type="submit">Tìm kiếm ngay</button>
    </div>

    <!-- Nút Chat hỗ trợ hình tròn màu xanh -->
    <a href="#" class="floating-chat-btn">
      <i class="fa-solid fa-user-astronaut"></i>
    </a>
  </section>

  <!-- DANH MỤC SẢN PHẨM HÌNH TRÒN -->
  <section class="category-menu-section">
    <div class="category-grid">
      
      <a href="dam.html" class="circle-item">
        <div class="circle-border">
          <div class="circle-inner">
            <i class="fa-solid fa-shirt"></i>
            <span>ĐẦM</span>
          </div>
        </div>
      </a>

      <a href="ao.html" class="circle-item">
        <div class="circle-border">
          <div class="circle-inner">
            <i class="fa-solid fa-user-tie"></i>
            <span>ÁO</span>
          </div>
        </div>
      </a>

      <a href="quan.html" class="circle-item">
        <div class="circle-border">
          <div class="circle-inner">
            <i class="fa-solid fa-vest"></i>
            <span>QUẦN</span>
          </div>
        </div>
      </a>

      <a href="chanvay.html" class="circle-item">
        <div class="circle-border">
          <div class="circle-inner">
            <i class="fa-solid fa-person-dress"></i>
            <span>CHÂN VÁY</span>
          </div>
        </div>
      </a>

      <a href="aokhoac.html" class="circle-item">
        <div class="circle-border">
          <div class="circle-inner">
            <i class="fa-solid fa-user-ninja"></i>
            <span>ÁO KHOÁC</span>
          </div>
        </div>
      </a>

      <a href="sale.html" class="circle-item">
        <div class="circle-border">
          <div class="circle-inner">
            <i class="fa-solid fa-tags"></i>
            <span>SALE</span>
          </div>
        </div>
      </a>

      <a href="phukien.html" class="circle-item">
        <div class="circle-border">
          <div class="circle-inner">
            <i class="fa-solid fa-gem"></i>
            <span>PHỤ KIỆN</span>
          </div>
        </div>
      </a>

      <a href="quatang.html" class="circle-item">
        <div class="circle-border">
          <div class="circle-inner">
            <i class="fa-solid fa-gift"></i>
            <span>QUÀ TẶNG</span>
          </div>
        </div>
      </a>

    </div>
  </section>
  
</body>
</html>
